name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua tests plugin scripts

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "luajit-2.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua tests plugin scripts

  test:
    name: tests (nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: ["v0.11.0", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # The fixture builder makes real commits, so git needs an identity.
      - name: Configure git identity
        run: |
          git config --global user.name "gitvim ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run tests
        run: make test

  benchmark:
    name: performance benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.6
      - name: Configure git identity
        run: |
          git config --global user.name "gitvim ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Run performance gates
        run: make bench
